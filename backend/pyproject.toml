[project]
name = "ai-interviewer-api"
version = "1.0.0"
description = "Layered FastAPI backend for AI Interviewer, a mini AI interviewer."
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
